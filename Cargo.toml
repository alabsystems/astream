# astream — a small, reproducibly-buildable, agent-native message bus.
# The gate (astream-wire + astream-evidence) is the
# foundation; the 13 members below are the built system — see README "Layout".
#
# HARD INVARIANT: zero private / git dependencies. Everything resolves from
# crates.io with a committed Cargo.lock so `cargo build --locked` works from a
# clean checkout on any runner. This is the headline correctness property.

[workspace]
resolver = "2"
members = [
    "crates/astream-wire",
    "crates/astream-evidence",
    "crates/astream-term",
    "crates/astream-engine",
    "crates/astream-host",
    "crates/astream-effects",
    "crates/astream-agent",
    "crates/astream-live",
    "crates/astream-broker",
    "crates/astream-cap",
    "crates/astream-kafka",
    "crates/astream-pump",
    "crates/astream-aead",
]
# NOTE: a `verify/` workspace will live in a SEPARATE workspace and must never
# appear in these members — the evidence gate enforces this (see gate.rs).

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/alabsystems/astream"
authors = ["Andrew Yates"]
# 1.89 is the floor `BrokerLog` needs for `File::try_lock`/`unlock` (the exclusive
# log lock); the toolchain is pinned at 1.95 in rust-toolchain.toml.
rust-version = "1.89"

[workspace.dependencies]
astream-wire = { path = "crates/astream-wire", version = "0.1.0" }
# Third-party (crates.io only — no git, no path-to-private):
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"
proptest = "1.5"

[profile.release]
# Deliberately NOT panic="abort": astream isolates faults per-connection and
# wants to unwind one task rather than kill the node (a predecessor lesson).
lto = true
codegen-units = 1
