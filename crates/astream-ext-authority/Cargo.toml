[package]
name = "astream-ext-authority"
description = "An independent model of an external identity authority: SSH-agent certificate validity chain, OIDC JWT `nbf`/`exp` claims window, overlapping host-key rollover, peer allowlist epoch reload, certificate revocation serial check, and principal key rotation ledger; no astream runtime crate and no aterm code calls it. The shipped external identity authority is `astream-aead`'s `cert.rs`. forbid(unsafe_code)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
astream-digest = { workspace = true }
