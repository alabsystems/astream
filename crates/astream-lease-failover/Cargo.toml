[package]
name = "astream-lease-failover"
description = "An independent model of an autonomous lease-heartbeat replica failover daemon: leader lease TTL expiry clock, quorum witness ballot counter, epoch-fenced automatic replica promotion, zombie-leader stale-epoch write fence, divergent-tail truncation point, and follower catch-up lag admission gate; no astream runtime crate and no aterm code calls it. The shipped quorum election and epoch-fenced promotion are `astream-broker`'s `failover.rs`. forbid(unsafe_code)."
