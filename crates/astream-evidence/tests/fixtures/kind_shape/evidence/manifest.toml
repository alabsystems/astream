# INTENTIONAL VIOLATION FIXTURE (scanned by the gate test only).
# Commands that do not fit their declared kind: the runner judges a claim by
# its kind, so each of these would be judged by a check that cannot bite.
[meta]
project = "fixture-kind-shape"

[[claim]]
id = "test.not.cargo.test"
kind = "test"
text = "Strict durability survives kill -9."
command = "sh -c true"

[[claim]]
id = "build.not.cargo.build"
kind = "build"
text = "Clean checkout builds."
command = "cargo --version"

[[claim]]
id = "selftest.unpinned"
kind = "selftest"
text = "A deterministic command's output is pinned."
command = "cargo run --locked --example replay"

[[claim]]
id = "shaped.fine"
kind = "test"
text = "A well-shaped claim is not flagged by the shape rule."
command = "cargo test --locked --lib frame"
