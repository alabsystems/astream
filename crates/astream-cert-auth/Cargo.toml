[package]
name = "astream-cert-auth"
description = "An independent model of external-authority cryptographic identity binding: OpenSSH ssh-ed25519-cert-v01@openssh.com validity and serial verification, OIDC claim mapping, dual-root CA rotation, CRL epochs, principal namespaces, and PoA delegation; no astream runtime crate and no aterm code calls it. The shipped external identity authority is `astream-aead`'s `cert.rs`. forbid(unsafe_code)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
astream-wire = { workspace = true }
astream-digest = { workspace = true }
astream-cap = { workspace = true }
