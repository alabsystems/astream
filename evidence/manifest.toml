# The single source of truth for every claim astream makes.
# `astream-evidence render --write` regenerates the README table from this file.
# `astream-evidence run` executes each command and checks it.
# `astream-evidence gate` rejects any drift between this file and the docs.

[meta]
project = "astream"

[[claim]]
id = "build.reproducible"
kind = "build"
text = "The workspace builds with the committed lockfile: `cargo build --locked` fails if Cargo.lock would need any change, so every dependency resolves exactly as pinned. It runs in the working tree (not a fresh clone) and does not itself check for git dependencies -- those are rejected by the gate's no-git-deps lint (gate.rejects-known-failures), which scans every dependency table, [patch]/[replace] redirects, and Cargo.lock's resolved sources."
command = "cargo build --locked --workspace"

[[claim]]
id = "wire.frame.panic-safe"
kind = "test"
text = "The wire frame round-trips and rejects truncated, oversized, and corrupt input without panicking -- an example-based unit test of Frame::encode/decode; this command asserts nothing beyond it. The Trust-toolchain compiler-verification survey of this crate (evidence/verify/trust-wire.md, re-captured by scripts/verify-trust.sh) is a separate attached artifact: it is not run by make ci and is not asserted by this claim."
command = "cargo test --locked -p astream-wire --lib frame"

[[claim]]
id = "wire.address-grammar.validated"
kind = "test"
text = "Subject and Filter validate in their constructors and reject partial-segment and misplaced wildcards."
command = "cargo test --locked -p astream-wire --lib subject"

[[claim]]
id = "wire.router.matches-independent-oracle"
kind = "test"
text = "The Filter matcher agrees with an independently coded recursive oracle over generated well-formed inputs: filters of 1..=8 segments (literals from a prefix-colliding 5-token alphabet or `*`, optional trailing `>`) against subjects of 1..=10 literal segments, and every accepted filter matches a subject instantiated from it. Over structured malformed inputs (0..=8 segments of literal, `*`, `>`, `fo*`, empty, or control byte, with or without the leading slash) the Filter/Subject validators return the exact spec-prescribed error variant, and an exhaustive enumeration up to 3 segments reaches every FilterError and SubjectError variant. A no-panic sweep over arbitrary 0..=40-char strings is a crash check only."
command = "cargo test --locked -p astream-wire --test router_differential"

[[claim]]
id = "wire.filter.containment"
kind = "test"
text = "Filter::contains is sound: A.contains(B) implies every subject matching B also matches A (no false positives), checked over a generated subject space against Filter::matches, plus known cases and reflexivity. As the subscribe-ACL scoping primitive (a bearer granted A may subscribe with any narrower B), soundness without completeness means the ACL can only be too strict, never too permissive. `>` contains any equal-or-longer non-empty tail; `*` contains a literal or `*` but never `>`; a literal contains only itself."
command = "cargo test --locked -p astream-wire --test filter_containment"

[[claim]]
id = "wire.partition.deterministic-and-in-bounds"
kind = "test"
text = "assign_partition is deterministic and always within range, including the zero-partition guard."
command = "cargo test --locked -p astream-wire --lib partition"

[[claim]]
id = "wire.hash.crc32-table-equiv"
kind = "test"
text = "crc32_ieee, the payload-integrity hash run on every frame encode and decode, is table-driven (slicing-by-8 over eight compile-time const 256-entry tables, no runtime initialisation) yet byte-identical to the retained bitwise reference: the canonical CRC-32/IEEE vector (123456789 -> 0xCBF43926), a differential test over every input length 0..=600 (seeded pseudo-random bytes covering all byte values), and fixed edge vectors. It changes throughput, not output."
command = "cargo test --locked -p astream-wire --lib hash"

[[claim]]
id = "gate.rejects-known-failures"
kind = "test"
text = "The merge gate rejects undeclared cfg-features (any whitespace, including a line break, around the `=`), git dependencies (every dependency table, [patch]/[replace] redirects, and git+ sources in Cargo.lock), unlinked task/drift markers (non-UTF-8 files included), constant-only tests (including assertion-message and `as`-cast laundered forms), and claims whose kind or platform is outside the closed sets. It never follows symlinks, prunes a named list of tool-state directories (.git, .claude, editor/direnv caches) so a path dependency vendored into any other dot-directory is still linted, refuses to run outside the workspace root, and astream passes its own gate. It also prunes a directory holding a CACHEDIR.TAG with the spec signature on its first line (an untagged same-named directory, or a tag with a wrong signature, is still scanned) and names every such skip on stdout."
command = "cargo test --locked -p astream-evidence"

[[claim]]
id = "gate.rejects-theater-evidence"
kind = "test"
text = "The merge gate rejects claims whose command is a known no-op program (a denylist -- true, :, echo, printf, cat, head, tail -- each asserted by a fixture claim, also behind leading VAR=value assignments), that can mask its own exit status (`||`, `;`, a pipe, a background `&`, a newline or a leading `!` outside quotes; `&&` is allowed), whose command does not fit its kind (a `test` claim must run `cargo test`, a `build` claim `cargo build`/`check`, a `selftest` must pin an output hash), or that cite a cargo package/target or path absent from the tree. This narrows decorative evidence rather than eliminating it: an exit-0 program outside the denylist under a bench/selftest kind still passes the gate."
command = "cargo test --locked -p astream-evidence manifest_integrity"

[[claim]]
id = "term.screen-fold.deterministic"
kind = "test"
text = "The astream-term VT screen is a deterministic, I/O-free fold of recorded output: a fixed adversarial record sequence (cursor moves, SGR, erase, alternate-screen round-trip, resize) folds to an independently asserted expected screen, folding twice is byte-identical, In/Exit records never paint, and folding arbitrary byte streams is panic-free and deterministic (proptest). ECMA-48 edge cases are each pinned by a fixed case modelled on xterm: OSC/DCS/APC strings and two-byte escapes are consumed unpainted; truecolour SGR is consumed and leaves the pen unchanged; private-marker CSI and colon sub-parameters never reset the pen; ESC inside an unfinished CSI starts a new escape; DEL is ignored and malformed UTF-8 yields U+FFFD; pending-wrap resolution and per-buffer DECSC/DECRC slots follow xterm."
command = "cargo test --locked -p astream-term --test screen_fold"

[[claim]]
id = "term.replay.byte-identical"
kind = "selftest"
text = "A captured terminal session (In/Out/Resize/Exit fed as effect-seam inputs, not a live PTY) records into a single-writer Log under a seeded seam, each record a versioned envelope (tag, seq, ts_logical from the seam Clock) inside a CRC frame on an in-memory Disk. After the live records are dropped, a separate read-by-offset pass over the stored bytes reconstructs records whose /out stream folds to a screen byte-equal to the live end-of-session screen, with seq and ts_logical equal to their recorded values; two seeded record passes produce byte-identical logs. Durability across process death is not exercised here (see term.strict.survives-kill)."
command = "cargo run --quiet --locked -p astream-engine --example replay"
expected_output_sha = "e7a0394570e254cedc370aad032a68f9dc36296cacc2d4759d9694975a1b50f5"

[[claim]]
id = "term.strict.survives-kill"
kind = "test"
text = "A durable log file with a torn final frame or a CRC-corrupt final record recovers to the last intact record: the tail is dropped (and truncated on disk by FileLog::open), every prior fsync'd record is retained, and the log re-folds to the screen as of that offset. A fault -- a corrupt frame followed by intact frames, another envelope version, or an out-of-sequence record -- is refused by FileLog::open with an InvalidData error naming the byte offset, leaving the file untouched; only FileLog::open_truncating repairs it. Session::resume_from continues a recovered file at the next offset with the clock past the stored ts_logical. On Unix, SIGKILL of a child appending fsync'd records recovers every acked record in order, as a clean prefix or torn tail, never a fault."
command = "cargo test --locked -p astream-engine --test crash_recovery"

[[claim]]
id = "term.resume.gapless-exactly-once"
kind = "test"
text = "A reattaching client paints the /a/state snapshot (the screen folded through offset K, with parser state) and folds only the log tail after K -- checked by replacing the first K+1 records with garbage -- landing on the exact screen of a never-dropped run at every K, including an escape sequence straddling the boundary. A snapshot never claims offsets it did not fold: an empty log gives folded_through = None and an over-range K is clamped. A re-sent input proposal is applied exactly once, deduped by (client_id, client_seq) in-session and across a reconnect whose dedup high-water is rebuilt from the log alone. Session::resume_from continues a recovered log and matches an uninterrupted recording byte for byte; it refuses a damaged log."
command = "cargo test --locked -p astream-engine --test resume"

[[claim]]
id = "term.echo.predict-and-reconcile"
kind = "test"
text = "Speculative local echo draws a printable keystroke (faint, unconfirmed) over the authoritative screen; after authoritative /out is folded, each prediction is confirmed or rolled back to ground truth. A predicted space is confirmed only once output shows its cell was traversed (the cursor passed it, or a glyph was painted to its right on the same row); otherwise it stays undecided/Lost, or Contradicted once the cell is painted with anything else, so a dropped space is never reported Confirmed. The predictor abstains on control/escape input. For any interleaving of predictions and output (proptest), the pre-reconcile view differs from the authoritative fold exactly at the outstanding prediction cells, every verdict matches an independent oracle, and the reconciled view equals the pure authoritative fold."
command = "cargo test --locked -p astream-term --test predict"

[[claim]]
id = "term.fork.counterfactual-replay"
kind = "selftest"
text = "Recording an agent session (In = what it typed, Out = what the world answered, both seam-recorded), then forking the log at the offset of one Out record and swapping it (the build result the agent saw), yields a byte-exact and screen-exact alternate history: re-forking is deterministic, the alternate log and screen differ from the original exactly at the swap, and untouched lines are identical. The output is pinned as a re-runnable regression. This forks the recorded history only; a live agent re-deciding on the swapped output is not exercised."
command = "cargo run --quiet --locked -p astream-engine --example fork"
expected_output_sha = "a35f4a6eadfc42559afcd59ce5ff7a2c98dd9d9da7141f2a7ab7b685fc16f943"

[[claim]]
id = "term.fork.multi-client"
kind = "test"
text = "Independent clients folding the same session log produce byte-identical screens (multi-client attach is consistent), a capability is a Filter over the session's subject subtree (read-only attach matches /a/stream/<S>/> but not the inbox; control matches the inbox but not the stream; read-only does not match another session's stream and control does not match another session's inbox), and the counterfactual fork is deterministic and exact."
command = "cargo test --locked -p astream-engine --test fork"

[[claim]]
id = "term.fork.prefix-stable"
kind = "test"
text = "Counterfactual fork is prefix-stable over the single-writer log: forking a recorded session at offset N (fork_swap) and re-recording under the same seed yields a log whose first N framed records are byte-identical to the original, whose bytes from N on differ, and which is deterministic across re-records -- for a fixed agent session and, by proptest, for arbitrary Out vectors with a differing replacement body. The log is not hash-linked, so a content-addressed (Merkle) session history is not established."
command = "cargo test --locked -p astream-engine --test fork_prefix_stable"

[[claim]]
id = "term.pty.records-and-replays"
kind = "test"
text = "On Unix, astream-host opens a real pseudo-terminal (posix_openpt on Linux, openpty elsewhere, so a macOS run exercises only openpty), fork+execs a deterministic child, drains the master into Record::Out on the single-writer Log through the effect seam, and reaps the exit into Record::Exit. A separate pass over only the stored bytes (no PTY, no OS calls) reconstructs records whose /out folds byte-equal to both the live final screen and an independently asserted expected screen; chunk boundaries and timing are not asserted. An unexecutable program is an Err from Pty::spawn carrying the exec errno, never Ok ending in Exit 127, and the child runs with default SIGPIPE, not the runtime's SIG_IGN. The workspace's unsafe code is confined to two cfg-gated astream-host modules, compiler-enforced. A recorded real-PTY session that replays, not an interactive shell or SSH."
command = "cargo test --locked -p astream-host --test pty_record_replay"

[[claim]]
id = "term.fleet.consistent-cut-replay"
kind = "test"
text = "Two fleet sessions on independent single-writer logs with a recorded cross-injection edge (an orchestrator's Out at one offset causing a child's injected In at another, held as an in-memory CrossEdge of real offsets, not a wire field) admit a consistent cut -- a vector of per-partition offsets that admits the cause of every effect it admits; effect-without-cause cuts are rejected, in-flight cuts admitted. Replaying each partition from the cut re-folds byte-equal to its truncated live screen, over a fixed scenario and by proptest over two partitions' arbitrary Out vectors and cut offsets (a partition may be absent). A decode error before the cut is returned, bytes past the cut are never read, and is_consistent agrees with an independent oracle. The durable on-log form is term.fleet.durable-watermark."
command = "cargo test --locked -p astream-engine --test fleet_consistent_cut"

[[claim]]
id = "term.echo.watermark-retire"
kind = "test"
text = "Speculative echo retires against the engine out-offset (read back from a real single-writer Session log via Log::read_from, a numbering domain distinct from client_seq), not screen position: retirement is incremental and watermark-monotone, a contradiction squash-rebuilds the overlay from confirmed state, an out-of-order watermark is rejected, and for any interleaving of predictions and watermark-ordered output (proptest) the authoritative screen stays the pure fold and the reconciled view shows no residue. It retires by monotone offset progress, not causal link (see term.echo.caused-by-retire)."
command = "cargo test --locked -p astream-engine --test watermark_retire"

[[claim]]
id = "term.screen-ops.lossless-projection"
kind = "test"
text = "One VT parser (astream-term::screen) projects the raw Out byte log into a typed screen-op stream (print, cursor moves, erase, resolved SGR, DEC private modes, save/restore cursor, scroll region, reset, resize), and re-applying the ops to a fresh Screen reproduces a screen byte-equal to the raw VT fold, over a fixed adversarial fixture and arbitrary byte streams at small viewports (proptest). Op re-application is an independent dispatch path through the shared mutators, bypassing only the VT state machine. The projection is lossless only for this fold's bounded subset (scroll region and background-colour erase in; one char per cell, no truecolour, no character sets; string sequences and unmodelled escapes emit no op), not full xterm."
command = "cargo test --locked -p astream-term --test screen_ops"

[[claim]]
id = "term.perceive.query"
kind = "test"
text = "An orchestrator reads any child terminal as text and structured queries reconstructed from the recorded Out log at any offset: frame(K) equals the fold of records[0..=K], text() reads per-row lines, blocks() partitions exactly the maximal contiguous non-empty regions (the exact Block list on the fixture; structural invariants on arbitrary bytes), and search() returns character-column-accurate, non-overlapping, multibyte-correct hits -- over an evolving fixture at every offset, and panic-free and self-consistent on arbitrary bytes (proptest). OSC/DCS string sequences never reach text, search, or blocks."
command = "cargo test --locked -p astream-term --test perceive"

[[claim]]
id = "term.perceive.semantic-events"
kind = "test"
text = "astream-term classifies a recorded session into the semantic boundaries a driving agent wakes on -- prompt-ready, command-start, command-end (with exit code), screen-quiescence -- as a deterministic, I/O-free projection of the Out log. OSC-133/633 A/C/D marks are the authoritative signal, recognised even when split across records; a frame_hash-stable quiescence point is the fallback; a glyph Profile (e.g. ❯, >>>, $) matched on the settled last line supplies prompt-ready only for a target that has emitted no A, C or D mark, and other mark letters do not disable it. Events follow streaming order, not a global offset sort. No false prompt without a marker; panic-free and deterministic over adversarial bytes. A streaming EventClassifier matches the batch classifier over the fixtures, an OSC-133 session split at every byte boundary, and proptest-generated sessions cut at arbitrary lengths."
command = "cargo test --locked -p astream-term --test events"

[[claim]]
id = "pump.wake-on-boundaries"
kind = "test"
text = "The astream-pump Pump, subscribed to a target session's /out subtree on a live in-process broker, classifies deliveries into semantic wakes (prompt-ready, command-start, command-end with exit code, screen-quiescence), exercising broker subscribe -> fold -> classify -> wake end to end. Each OSC wake surfaces from next_wake() on the exact delivery that carries it, tagged with that delivery's broker offset, and quiesce() yields only the settle event; a woken agent reads the screen by folding /out through that offset, as no /a/state snapshot is published on the bus. from_offset is inclusive: re-attaching at offset() re-delivers the last wake, at next_offset() continues with no gap or duplicate. The cursor here is client-held (the durable group form is pump.attach-subject-and-group). The crate command also runs the pump.cli.wake-lines tests."
command = "cargo test --locked -p astream-pump"

[[claim]]
id = "pump.cli.wake-lines"
kind = "test"
text = "The `aspump` binary, spawned against a live in-process broker, tails a session's /out and prints wake lines tagged with broker offsets -- for the fixture exactly `PROMPT_READY boffset=1`, `COMMAND_START boffset=3`, `COMMAND_END boffset=5 exit=0`, then `QUIESCED boffset=5` after --debounce. --from N is inclusive; --subject tails a fabric face; --tcp tails over TCP; --group is a broker-durable cursor: a killed run's replacement replays nothing it committed except the one delivery whose commit it still held (at-least-once), so a QUIESCED the killed run never printed is printed by its replacement; an uncommitted group starts at 0. A subscription rejection exits 1 with the reason on stderr; a broken stdout pipe or broker close exits 0; malformed or conflicting flags and a --key on argv (either spelling, never echoed) exit 2 before connecting. A stdout already closed at launch is not covered."
command = "cargo test --locked -p astream-pump --test aspump_cli"

[[claim]]
id = "pump.cli.argv-not-utf8"
kind = "test"
text = "An `aspump` argument that is not valid Unicode is a usage error (exit 2), never a panic (exit 101): checked on the real binary for a flag value (`--key-file` with a path containing byte 0xFF, whose message says the argument is not valid UTF-8) and for a positional, against a nonexistent endpoint so only argv rejection can yield 2. A dead stderr is not a panic either: with the pipe's read end dropped before spawn, a usage error still exits 2 and a connect failure still exits 1, and a readable stderr still gets the message. Unix-only tests covering argv and the standard streams only; non-UTF-8 bytes arriving by other routes (e.g. a subject or key read from a file) are not covered."
command = "cargo test --locked -p astream-pump --test aspump_argv --test aspump_stderr_status"

[[claim]]
id = "pump.attach-subject-and-group"
kind = "test"
text = "Over a live in-process broker, Pump::attach_subject on a fabric face (/f/F/term/n1/s1/out) yields exactly the wake lines Pump::attach yields on /a/stream/term/s1/out (asserted against a literal four-wake list at the same offsets); a record on another subject of the same log is never delivered; and its commit fails with Unsupported, having no group. Pump::attach_group subscribes as a broker consumer group: a pump that commits through offset 3 and is dropped is replaced by one given no offset, which is delivered 4, 5, 6 (never the hidden /a/commit records), and the two pumps' wakes joined equal one uninterrupted pump's. commit() commits through offset() and returns None before any delivery. The guarantee is at-least-once: a pump killed between delivery and commit re-delivers that record. Broker restart and capability enforcement are not exercised."
command = "cargo test --locked -p astream-pump --test pump"

[[claim]]
id = "term.perceive.render-deterministic"
kind = "test"
text = "The image and animation perception modalities reconstruct deterministically from the recorded Out log at any offset. rasterize(screen) is a pure cell thumbnail (one RGB pixel per cell: resolved fg if inked, else bg; reverse video swaps the resolved colours, asserted pixel-for-pixel); frame(K) is the screen as of offset K; animation(from,to) is the frame_hash-deduplicated frame sequence, in which In and Exit records yield unchanged frames; a forked timeline shares a bit-identical frame-hash prefix and diverges only after the fork. Over a fixture and arbitrary bytes (proptest), every frame hash equals an independent fold at that offset and rasterize is deterministic and panic-free. A cell thumbnail, not glyph-accurate rendering."
command = "cargo test --locked -p astream-term --test render"

[[claim]]
id = "term.drive.interactive-exactly-once"
kind = "test"
text = "On Unix, astream-host::Driver pairs a live PTY with a single-writer Session and dedups each input proposal by (client_id, client_seq) at the one ingest point: an echoing child is driven a keystroke, the same keystroke is re-sent (dropped, not written), then quit; its output contains the response exactly once and the log records exactly the two distinct keystrokes. A 128-line (8 KiB) burst plus quit, with no drain in between, is delivered without deadlock -- each line echoed once, all 129 Ins recorded -- because the driver drains output while the input queue is full. That drain is bounded: a child emitting 8 KiB per input byte fails the write at the 8 MiB PENDING_MAX cap with no In recorded. A proposal one byte past the frame payload cap is refused by Session::precheck_input before any byte reaches the PTY."
command = "cargo test --locked -p astream-host --test drive"

[[claim]]
id = "term.fleet.orchestrate-n"
kind = "test"
text = "On Unix, one orchestrator drives three real heterogeneous child terminals (one non-interactive, two interactively driven), each its own single-writer partition (Driver = Pty + Session). Each child session re-folds from its stored bytes to the child's screen; the interactive children echo their dispatched commands and each log holds exactly its two injected Ins (the non-interactive child's none). The orchestrator's cross-injection edges, whose effects are the real recorded offsets of each child's first In, form a consistent cut, and an orphaned-injection cut (effect admitted, cause excluded) is rejected."
command = "cargo test --locked -p astream-host --test orchestrate"

[[claim]]
id = "term.fleet.control-handoff"
kind = "test"
text = "A shared session has exactly one writer at a time, enforced by the engine: Session::apply_input_as (and apply_input_caused_as) takes the session's ControlToken and refuses a non-holder with EngineError::NotHolder before the log or dedup map is touched. Control transfers by claim (an explicit override) and grant (a non-holder's grant is refused). The log's In records are exactly the holder's inputs in order, each carrying the controller's client_id, so they form an auditable control history; refused attempts leave no trace and bump no dedup high-water, and the history replays deterministically. Enforcement is only at the token-taking ingest: plain Session::apply_input takes no token, and the astream-host Driver still calls it."
command = "cargo test --locked -p astream-engine --test control_handoff"

[[claim]]
id = "term.fold.scroll-region"
kind = "test"
text = "The fold honours DECSTBM: text scrolls within the region [top,bottom] while rows outside it are untouched, a bare CSI r resets to the full screen, and a grow or shrink resize clears the region. The typed screen-op projection stays lossless through a scroll region (emit_ops then apply_ops reproduces a byte-equal screen). A dependency-free generator of 300 random region programs asserts that rows outside the region never move and in-region content shifts by the scroll count."
command = "cargo test --locked -p astream-term --test scroll_region"

[[claim]]
id = "effects.cooperative.record-replay"
kind = "test"
text = "A program written once against astream-effects::EffectSeam consumes, in fixed order, one real wall-clock nanosecond, two random words, and one real file's bytes; each live value is recorded as a typed EffectRecord on a separate in-memory EffectsLog, and replay from the tape alone yields a byte-identical digest. ReplaySeam holds no real backend, so replay consumes no OS effect, and a short or wrong-kind tape aborts (checked via catch_unwind). The digest equals an independent inline oracle, the two random words differ, and the fold is order-sensitive, so a dropped, wrong, or transposed value is observable. A failed file read is taped as FileErr{path, ErrorKind} and replays as that error even after the file is created; a diverged path aborts. The RNG's OS seeding is not asserted. Seam-cooperative programs only (see effects.foreign-process.record-replay)."
command = "cargo test --locked -p astream-effects --test cooperative_replay"

[[claim]]
id = "effects.foreign-process.record-replay"
kind = "test"
platform = "linux"
text = "On Linux, astream-host::foreign forks a child (no exec) running a fixed effect program -- a wall clock, eight random bytes, a file read, folded order-sensitively -- through raw syscalls that a ptrace tracer intercepts. The child never sees taped values but is astream-authored (it self-attaches with PTRACE_TRACEME), not an unmodified binary. Record tapes each result into the astream-effects EffectsLog; replay overwrites each result (return register and output buffer), reproducing the recorded digest in a deliberately changed world where a no-inject replay diverges. The digest matches an independent oracle; a short, wrong-kind, path-divergent (checked against the requested path, not the tracee's openat argument), or over-buffer tape aborts. The kernel still executes each replayed syscall. The claim is Linux-gated: it runs in the Linux CI job and is skipped on a macOS `make ci`."
command = "cargo test --locked -p astream-host --test effects_foreign_process"

[[claim]]
id = "term.cognition.replay-and-fork"
kind = "selftest"
text = "astream-agent records a bounded agent turn as a separate cognition log (CogRecord::Completion and ToolResult envelopes in CRC frames) and replays it without network or tools: a fixed hand-authored 5-record transcript drives a planner loop whose ReplayPlanner is a deterministic content-keyed stand-in for model cognition, emitting a decision trace. Two replays are bit-identical; swapping one recorded ToolResult (BUILD FAILED -> BUILD OK) with cog_fork_swap re-drives the same fixed policy down another branch, so the alternate trace shares a prefix then diverges and the alternate screen omits the recovery and shows BUILD OK. Replay re-feeds recorded completion bytes to a fixed policy; it does not recompute the model and makes no model-fidelity claim. Live capture (astream-live, #[ignore]-gated) is not exercised."
command = "cargo run --quiet --locked -p astream-agent --example agent_replay"
expected_output_sha = "e0ccfd7b2e13eb688d4fed1a4f115b784df9f646e870c79979c0a38a87c022e9"

[[claim]]
id = "term.fleet.durable-watermark"
kind = "test"
text = "A child's injected In durably stamps the orchestrator Out that caused it in its envelope header (a caused_by (Partition, Offset)). After the live sessions are dropped, cross_edges_from_logs decodes the stored child-log bytes alone and rebuilds a CrossEdge equal field-for-field to one built from the offsets the appends returned; with no cause stamped there is no edge, and a different cause offset yields a different edge set. is_consistent over the rebuilt edge rejects the orphan cut and admits the in-flight cut, and replay_to_cut re-folds the child screen byte-equal to a direct prefix fold. Over a child log whose writer restarted at seq 0, the scan emits only the edge in the intact prefix and recover reports an out-of-order fault. It does not prove a pointer names the record that truly produced the effect (honest pointers are assumed), nor recover unstamped injections."
command = "cargo test --locked -p astream-engine --test fleet_durable_watermark"

[[claim]]
id = "term.echo.caused-by-retire"
kind = "test"
text = "When echoes reorder, positional/watermark retirement (Predictor::apply_output_at) mis-assigns a verdict and exact caused_by retirement (apply_output_caused) does not. The fixture log holds two real In records applied through session ingest and their echoes arriving reordered, each Out's decoded caused_by naming an earlier In; the engine refuses a same-log cause not strictly earlier than its record (nothing is written). caused_by retirement matches each Out to its keystroke by in-offset and decides the verdict from the Out's bytes, agreeing with an independently built ground truth, while the positional foil marks keystroke A Contradicted. authoritative() still equals the pure fold of the outs in arrival order. The correlation is authored by the fixture (pointers are stamped, not observed from PTY I/O), and caused_by fixes verdict assignment, not the screen's order-sensitivity."
command = "cargo test --locked -p astream-engine --test caused_by_retire"

[[claim]]
id = "term.fold.bce"
kind = "test"
text = "The fold honours background-colour-erase: ED and EL fill erased cells with the current SGR pen background, while a default erase stays a default blank and cells outside the erase are untouched, asserted against Color::Indexed/Color::Default literals. The typed screen-op projection stays lossless through bce with no new op (emit_ops then apply_ops reproduces the background byte-equal). Cross-validation against the aterm engine lives out of tree and is not run by this command; reverse-video bce is out of scope."
command = "cargo test --locked -p astream-term --test bce"

[[claim]]
id = "term.session.unified-replay-and-fork"
kind = "test"
text = "A session carrying all four streams -- Inputs, Outputs, Effects (clock/rng/file), Cognition (Completion/ToolResult) -- on one offset axis replays deterministically (decision trace, applied-input count, screen and its content hash, and effect digest each reconstruct bit-identically twice), and a counterfactual fork of one cognition record makes all four diverge coherently: swapping the failed build result for a clean one ends the turn early, so the trace is a shorter shared prefix, the screen omits the recovery output and its hash moves, fewer inputs apply, and the effect digest differs. The effect digest is kind- and path-aware (swapping Clock for Rand, a read's path, or an empty for a failed read moves it). This replays and forks a recorded session; live capture (astream-live, #[ignore]-gated) is not exercised, and the screen hash is a proxy, not pixel-exact rendering."
command = "cargo test --locked -p astream-agent --test unified"

[[claim]]
id = "cognition.live-bridge.parse-and-replay"
kind = "test"
text = "The live-capture bridge (no third-party deps; a hand-rolled recursive-descent JSON parser) turns a real-format Anthropic Messages response -- text and tool_use blocks with nested input, plus stop_reason -- into a CogRecord: nested input is re-serialized to round-trippable bytes (control characters escaped, integers beyond 2^53 kept verbatim, non-RFC-8259 number lexemes rejected), and malformed input, including over-deep nesting and ill-formed surrogate escapes, is rejected without panicking. unified_from_capture assembles the four streams from the parsed completion plus a caller-supplied tool output, error flag and clock value (the bridge does not run the tool), and the result replays bit-identically through astream_agent::replay_session and forks coherently. The keyed API call and the Claude CLI call are #[ignore] tests, not exercised here."
command = "cargo test --locked -p astream-live --test capture_replays"

[[claim]]
id = "engine.durable.exactly-once-resume"
kind = "test"
text = "astream-engine::WorkflowJournal commits each step's output of a fixed ordered workflow to a Strict (fsync-per-append) CRC-framed journal; on reopen it recovers the longest intact in-order step prefix and run() executes only uncommitted steps. With a crash modeled as dropping the journal, at every inter-step boundary and across arbitrary repeated crashes (proptest), each step runs exactly once in order and the outputs equal a never-crashed run. On the real file, a torn or CRC-corrupt final record is truncated durably; a mid-journal fault (a corrupt record before fsync'd commits, an out-of-order step, another STEP_VERSION) makes open refuse with InvalidData naming the offset, leaving the file untouched, and open_truncating repairs it. A crash mid-step, after its side effect but before its fsync, re-runs that step (at-least-once), so a step's side effect must be idempotent or be the commit itself. Single-writer and in-process only."
command = "cargo test --locked -p astream-engine --test durable"

[[claim]]
id = "broker.exactly-once-pubsub-resume"
kind = "test"
text = "astream-broker, a thread-per-connection daemon (here over a Unix-domain socket), is exercised over real sockets with an in-process broker and no sleeps: (1) publish is exactly-once ingest -- a re-sent (producer_id, producer_seq) is not re-appended and returns its original offset from a Strict durable log; (2) Subscribe(filter, from_offset) streams matching records in dense offset order, then tails new ones live; (3) a consumer that drops and reconnects at last_committed+1 resumes with no gap or duplicate; (4) replay from 0 is byte-identical twice; (5) non-matching subjects are excluded; (6) acked publishes and the dedup map survive a restart; (7) an unserved Broker releases the log lock, and serve never displaces a live broker. Delivery is at-least-once; exactly-once needs an offset-cursor consumer (see broker.true-exactly-once-e2e)."
command = "cargo test --locked -p astream-broker --test exactly_once_pubsub_resume"

[[claim]]
id = "broker.last-value"
kind = "test"
text = "Last{filter, after, max} returns the newest record of each matching subject sorting strictly after `after` (at most max, in subject order), then Mark{next, head, resume}; the connection stays usable and Subscribe{from: next} continues with no gap or duplicate. Pages reassemble the one-page answer, which equals the last-per-subject fold of a from-0 replay and is byte-identical after a restart. max clamps to 4096 and each scan round visits at most 65536 entries; resume is empty or a subject the filter matches. Hidden /a/commit, /a/will and /a/bind never appear and are refused to client publish; a producer may create at most 4096 subjects; 16 subscribers each get 1000 records once, in order; a non-reading peer is torn down. Consistency is per page, not across pages; a subject superseded mid-walk is omitted, not stale; exhausting the 64 scan rounds is untested."
command = "cargo test --locked -p astream-broker --test last_value --test broker_core_regressions --test last_snapshot"

[[claim]]
id = "broker.last-walk"
kind = "test"
text = "Client::last_walk(filter, after, max, on_row) pages Last on the Mark's resume cursor until it comes back empty (never on a short page), handing each row to on_row; it returns the FIRST page's (next, head) and a continuation (None when the whole answer was delivered, Some(after) after Walk::Stop or `max`). Client::last_all collects the same walk, and asb's `last` uses it. Over a real broker with LAST_PAGE_MAX + 100 subjects every subject is returned exactly once in order; a write made between pages lands above the returned head and a Subscribe from its next delivers it; Stop, max paging, max=0 and on_row errors end the walk exactly and leave the connection usable. Against a scripted peer: empty pages with a live cursor are walked through, a page longer than it asked for is refused as InvalidData with none of its rows delivered, and LAST_WALK_PAGES_MAX (4096) requests without an end is an error, never a short answer. The page bound is exercised against a scripted peer, not a real broker; rows are a union of per-page snapshots, so a reader that tails folds newest-wins."
command = "cargo test --locked -p astream-broker --test last_walk"

[[claim]]
id = "broker.fetch-bounded"
kind = "test"
text = "Fetch{from, filter, max} is a bounded, non-terminal read: unlike the streaming verbs it answers in the request loop and hands the connection back. It delivers at most max matching records with offset >= from, scanning at most FETCH_SCAN_MAX = 65536, then Mark{next, head} with next after the last record scanned, so a page matching nothing still advances. Over real Unix sockets, max=3 pages a 10-record log once in order and the connection then publishes again; max=0 returns the head; on a 70 000-record log with a sparse filter the first page stops at next = 65536 (the cap, not max) and paging reaches every match once. Hidden /a/commit records are scanned, never delivered; pending pipelined acks are flushed first. A bound on work per request, not a rate limit; the Replicated tier's lagging head is exercised only via the store's `visible` argument."
command = "cargo test --locked -p astream-broker --test fetch"

[[claim]]
id = "broker.agent-native-fork-and-cognition"
kind = "test"
text = "Two agent-native delivery verbs built on the broker's subscribe primitive. ForkSubscribe streams an alternate timeline -- the topic forked at offset N with that one record swapped -- to a sandbox consumer while the live log and subscribers are untouched (a fresh live subscriber still sees the original record at N); no producer is re-run. A real astream-agent CogRecord (tool_use) published to /a/cog/<session>/tool_use/<class> reaches an auditor subscribed to /a/cog/*/tool_use/secret for every session's secret class and not the others, and the delivered bytes decode to the original CogRecord. Fork-delivery is a frozen snapshot whose stream ends, not a live counterfactual; routing is by publisher-assigned subject, not message content."
command = "cargo test --locked -p astream-broker --test agent_native"

[[claim]]
id = "broker.true-exactly-once-e2e"
kind = "test"
text = "A consumer group's committed offset lives on the broker (rebuilt from the log's commit annotations on open), so SubscribeGroup resumes past committed records and never re-delivers them, including across a full broker restart. process_and_produce appends the output and commits the input offset in one durable record (one fsync), deduped by (producer_id, producer_seq): a retried transaction, as after a crash before the ack, appends no second output and applies no second commit (a sentinel published after the retry is the next output delivered). The reserved /a/commit subject is broker-internal: its records consume offsets but are never delivered, even to /a/>, and a client publish, read-process-write output, or fork replacement there is refused with nothing appended and the idempotency key unconsumed. Single broker, single durable log; no cross-partition transactions."
command = "cargo test --locked -p astream-broker --test exactly_once_e2e"

[[claim]]
id = "broker.bench.publish-floor"
kind = "bench"
text = "The broker's durable-publish hot path -- publish over a Unix socket, acked only after the Strict per-message fsync -- holds a throughput floor (BENCH_N=500), a regression gate on the write path. The comparison with Redis (AOF appendfsync=always) is a separate, machine-specific attached artifact (evidence/bench/broker-vs-redis.md, via scripts/bench-vs-redis.sh), not asserted by this command."
command = "BENCH_N=500 cargo run --quiet --release --locked -p astream-broker --example broker_microbench"
metric = "broker_publish_ops_per_sec"
min_value = 10.0

[[claim]]
id = "broker.group-commit-durability"
kind = "test"
text = "The broker routes every mutation (publish, commit, process_and_produce) through one writer thread that batches queued records under a single fsync and acks each only after that fsync, so an ack still implies fsync'd. Under concurrency (16 producers x 50), acked offsets are distinct over a gap-free spine, a re-sent (producer_id, producer_seq) is deduped to its original offset, and a shutdown plus reopen recovers every record without duplicates. Through the log's fault-injection seam, a failing batch fsync tells every op in the batch 'commit failed', leaves the head unmoved and subscribers unaware, and rolls the file back to the durable prefix; once the fault clears the same keys append anew, and a failed rollback truncate poisons the log until reopen. Single durable log; open fsyncs the recovered file and its parent directory every time, which this command does not witness."
command = "cargo test --locked -p astream-broker --test group_commit"

[[claim]]
id = "broker.model-based-equivalence"
kind = "test"
text = "An in-memory reference model (a Vec plus dedup and group-commit maps; it shares the implementation's staging vocabulary, so it specifies the same interface rather than being a foreign oracle) runs in lock-step with the file-backed group-commit BrokerLog over many seeded random operation sequences, compared after every staged op, flush, simulated crash, and final reopen: head, every durable record, group_start per group, and both dedup maps. The mix exercises the commit-subject dedup exemption, offset assignment, group-commit monotonicity, and refusal of /a/commit publishes. A crash drops the log with an unsynced staged batch and cuts the file mid-frame or zero-fills the tail; the reopened log must match the model's crash rule. Std-only, seeded, reproducible. It claims no whole-system or agent-behaviour correctness."
command = "cargo test --locked -p astream-broker --lib model_tests"

[[claim]]
id = "broker.bench.groupcommit-floor"
kind = "bench"
text = "The group-commit write path holds a concurrent durable-throughput floor (32 producers, each awaiting a Strict fsync-before-ack) that fails if batching breaks, since one fsync is amortized over a batch. The absolute floor catches a regression to fsync-per-message only on hosts where an fsync costs milliseconds; with sub-millisecond fsync or a tmpfs log directory the un-batched rate itself clears it, and the gate detects only a catastrophic slowdown."
command = "PRODUCERS=32 BENCH_N=200 cargo run --quiet --release --locked -p astream-broker --example broker_groupcommit_bench"
metric = "broker_groupcommit_ops_per_sec"
min_value = 500.0

[[claim]]
id = "broker.pipelining"
kind = "test"
text = "One connection keeps many publishes in flight: the broker splits it into a read half that submits to the group-commit writer and an ack-writer thread that streams acks back in order, joined by a bounded queue (PIPELINE_DEPTH) that back-pressures the client so per-connection memory is capped; in-flight publishes share group-commit fsyncs under the same Strict ack-after-fsync guarantee. In-process: 500 publishes pipelined on one connection (window 128) ack in dense request order with no duplicate; re-pipelining the same (producer_id, seq) range dedups to the original offsets; subscribing on the same connection flushes pending acks, then streams the records in offset order; after a restart every acked record is durable and re-delivered in order. Ordering is per-connection; cross-connection order is the writer's single offset spine."
command = "cargo test --locked -p astream-broker --test pipeline"

[[claim]]
id = "broker.bench.pipeline-floor"
kind = "bench"
text = "Single-connection pipelining (window 256, each publish awaiting a Strict durable ack) holds a durable-throughput floor far above the one-in-flight rate, failing if it collapses to a fsync round-trip per message. The absolute floor catches that regression only on hosts where an fsync costs milliseconds; with sub-millisecond fsync or a tmpfs log directory the synchronous rate itself clears it, and the gate detects only a catastrophic slowdown."
command = "WINDOW=256 BENCH_N=5000 cargo run --quiet --release --locked -p astream-broker --example broker_pipeline_bench"
metric = "broker_pipeline_ops_per_sec"
min_value = 1000.0

[[claim]]
id = "broker.bench.replay-egress-floor"
kind = "bench"
text = "The delivery/replay egress path holds a throughput floor: a subscriber replays a 10 000-record backlog of 256-byte bodies from offset 0, with catch-up reads handing out shared Arc records and delivery frames built from the borrowed record, without a deep copy. At BODY=256 the floor allows ~50 us per delivery, so it gates only a catastrophic (~10x) egress slowdown, not a reintroduced per-record copy, which would surface only at large bodies this command does not run."
command = "BENCH_N=10000 BODY=256 cargo run --quiet --release --locked -p astream-broker --example broker_replay_bench"
metric = "broker_replay_ops_per_sec"
min_value = 20000.0

[[claim]]
id = "broker.bench.last-floor"
kind = "bench"
text = "The Last retained-state query holds a throughput floor over 10 000 subjects with 200 000 records of history (20 per subject), queried as 4096-row pages under a wildcard filter, every measured query returning a full page (a short page exits 2). The absolute floor catches a per-query walk of the history (~50x the work of the index range scan). Two same-run ratio gates also exit 2: a 64-row page must be at least 8x cheaper than a 4096-row page (catching a scan of the whole history or subject index), and durable publish throughput on a second connection while queries run must stay at or above 0.25 of idle (catching a query holding the log lock throughout). These are single-machine rates and ratios: they do not bound the lock hold within a page, report no latency percentile, and a correct implementation on much slower hardware could approach the floor."
command = "SUBJECTS=10000 HISTORY=200000 cargo run --quiet --release --locked -p astream-broker --example broker_last_bench"
metric = "broker_last_queries_per_sec"
min_value = 20.0

[[claim]]
id = "broker.bench.fanout-floor"
kind = "bench"
text = "Live fan-out holds a delivery floor: 64 subscribers attached to one filter before 20 000 records are published must each receive every record at its exact dense offset (a gap or short count exits 2). The absolute floor catches only a catastrophic (~10x) egress collapse and is a whole-process rate, since broker, writer and all subscribers share the process. A same-run ratio gate also exits 2: durable publish throughput with four live subscribers must stay at or above 0.5 of that with none, showing delivery is off the commit path. The same ratio at all 64 subscribers is reported but not gated; observers are not free, and the broker's cost is not separated from the co-hosted subscribers'."
command = "SUBS=64 BENCH_N=20000 cargo run --quiet --release --locked -p astream-broker --example broker_fanout_bench"
metric = "broker_fanout_deliveries_per_sec"
min_value = 40000.0

[[claim]]
id = "broker.relaxed-tier"
kind = "test"
text = "A Relaxed ack means the batch is in the OS page cache (no fsync): it survives a process crash but not power loss; Strict (the default) acks only after fsync. At the Relaxed tier, acked records get a dense in-order offset spine and are delivered in order, a re-sent (producer_id, producer_seq) is deduped to its original offset, and a graceful restart recovers a clean prefix with dedup intact. A Relaxed broker in a child process acks 100 publishes and is SIGKILLed; on reopen every acked record is recovered in order with dedup intact, and a torn tail appended on top is truncated. Recovery truncates only an incomplete or all-zero trailing frame; a complete frame failing its CRC mid-log makes open refuse with InvalidData, leaving the file untouched, and only BrokerLog::open_repair truncates there. Power-loss durability for Relaxed is not claimed."
command = "cargo test --locked -p astream-broker --test relaxed_tier"

[[claim]]
id = "broker.bench.relaxed-floor"
kind = "bench"
text = "The Relaxed tier holds a single-producer throughput floor far above the Strict rate, since acks follow a page-cache write and fsync leaves the hot path (surviving a process crash, not power loss). The absolute floor catches an fsync creeping into the Relaxed path only on hosts where an fsync costs milliseconds; with sub-millisecond fsync or a tmpfs log directory it detects only a catastrophic slowdown. The metric is named by the tier that actually ran, from the same match that selects it (unit-tested in the example, which also refuses an unknown DURABILITY with exit 2); this command runs and gates only the relaxed tier."
command = "DURABILITY=relaxed BENCH_N=20000 cargo run --quiet --release --locked -p astream-broker --example broker_durability_bench"
metric = "broker_relaxed_ops_per_sec"
min_value = 5000.0

[[claim]]
id = "broker.replicated-tier"
kind = "test"
text = "A leader opened with Broker::open_replicated writes to the page cache (no fsync) and ships every committed record, commit records and annotations included, to follower brokers over TCP at its exact offset; a follower refuses a gap or conflicting record, so its log is an identical prefix. An ack is given only once a quorum of followers holds the record in memory, so it survives loss of the leader node but not full-cluster power loss; only a Will registration is acked on local commit. Tested: acks follow the follower's head advancing; after leader shutdown the follower serves every acked record with dedup; an unresponsive or dropped follower turns acks into errors until it is re-dialed and caught up; an unreachable quorum is refused at open; a follower that lost its log is rebuilt, a diverged one fenced, and one missing records below the leader's retention base is left behind rather than rebuilt. One static leader with static followers; no election or failover."
command = "cargo test --locked -p astream-broker --test replicated --test broker_core_regressions && cargo test --locked -p astream-broker --features retention --test replicated_retained_open"

[[claim]]
id = "broker.sharded-routing"
kind = "test"
text = "A ShardedBroker runs N independent single-partition brokers (each with its own durable log, writer, group commit and pipelining; no cross-shard lock), routing by assign_partition over the subject so each subject's records land in one shard, in order. Tested in-process: re-sends are deduped per shard; distinct subjects spread across shards, each with a dense offset spine; a fan-in subscription merges every shard's matches exactly once with per-shard order; every shard recovers after restart. The shard count is persisted, and a reopen, connect, or fan-in with a different count is refused; a per-shard failure reaches the fan-in consumer as an Err naming the shard; dropping a fan-in subscription closes every shard socket and joins every forwarder. Ordering is per-partition, not global, and sharding is not a single-disk Strict throughput win."
command = "cargo test --locked -p astream-broker --test sharded"

[[claim]]
id = "broker.tcp-transport"
kind = "test"
text = "The broker serves the same exactly-once pub/sub and resume protocol over TCP: connection handling is generic over the byte stream, and a TCP client drives publish, ordered exactly-once subscribe, resume from an offset across a disconnect, and dedup. Transport-independently, a connection that never completes a first frame is closed after the first-frame timeout while a quiet established producer is not, and simultaneous connections are capped: one beyond the cap gets an error frame and is closed, and a closed connection frees its slot. Plain serve_tcp is plaintext and unauthenticated, for trusted networks only; sealing and capabilities are separate claims (broker.sealed-tcp-roundtrip, broker.cap-enforced-on-attach)."
command = "cargo test --locked -p astream-broker --test tcp_transport"

[[claim]]
id = "broker.cli.pub-sub-roundtrip"
kind = "test"
text = "The `asb` CLI (serve/pub/sub/commit) round-trips bytes byte-exactly (through NUL and newline) over a real Unix socket, with `sub` framing pinned as `<offset> <nbytes>`, the raw body, then one newline. An explicit --id/--seq retry prints `<offset> dup`; a --seq without a stable producer id (--id or one bound grant) is a usage error. Flags are strict: non-numeric values, unknown or wrong-verb flags, a key or capability on argv, a surplus positional, a non-UTF-8 argument, or --from with --group exit 2 with nothing on stdout, and `--` ends flag parsing. A second `asb serve` on a live socket exits 1 while the first keeps serving. `sub --group G` resumes at the committed offset + 1, `commit` is monotone, and both survive a restart. `asb repair` truncates a log that `serve` refused for a corrupt record, reports the discarded bytes, and is idempotent. With the cap feature, a --cap-file grant attaches: in-scope publish and subscribe succeed, a widened filter is refused."
command = "cargo test --locked -p astream-broker --features cap --test cli_roundtrip"

[[claim]]
id = "broker.cli.tcp-roundtrip"
kind = "test"
text = "`asb --tcp` round-trips bytes byte-exactly over plaintext TCP (no confidentiality or peer authentication; trusted networks only), with framing pinned as in broker.cli.pub-sub-roundtrip; serve binds host:0 and prints the chosen address. With the aead feature, serve and both clients take the 32-byte PSK from an environment variable (--key-env) or a file (--key-file), never argv, and round-trip byte-exactly through the sealed wire; a --key-env naming an unset variable exits 2 rather than downgrading to plaintext, and a malformed key file is a usage error, not a panic. Both ends run on one host over loopback: this proves the CLI shape, not a two-machine run."
command = "cargo test --locked -p astream-broker --features aead --test cli_tcp"

[[claim]]
id = "broker.cli.fleet-verbs"
kind = "test"
text = "`asb` subprocesses (mint, --cap-file, last, fetch, drain, ack, pub --seq-file) run against a broker over a Unix socket, output pinned byte-exactly. last/fetch/drain print `<offset> <nbytes> <subject>`, the body, a newline; last/fetch end with `MARK next=<n> head=<h>`. fetch pages gaplessly from next; drain commits a group batch; ack appends answer and group cursor atomically, (a retry prints `dup`) under reserved sequences >= 2^63 that `--seq` may not use. mint refuses the unbound read-write cap in both spellings without --legacy-unbound; secrets and capabilities never come from argv; a bound grant supplies the producer id. `pub --seq-file` persists a write-ahead sequence and refuses an empty or non-numeric file. A crash can burn a sequence number or, since drain commits before printing, lose a batch; concurrent --seq-file use is not exercised; one host only."
command = "cargo test --locked -p astream-broker --features cap --test cli_fleet"

[[claim]]
id = "broker.cli.fleet-sealed"
kind = "test"
text = "The fleet-verbs flow over an XChaCha20-Poly1305-sealed TCP wire (--key-file) into a capability-guarded broker, with two nodes holding rings minted by `asb mint`: A publishes presence under its bound grant; B reads it read-only; B posts to A's inbox with its own principal as `<src>`, while a forged `<src>` is unauthorized and never lands; A drains exactly B's message and acks once (the retry prints `dup`); B fetches `re=<offset> state=handled`. A wrong pre-shared key never attaches (exit 1, state unchanged), and an attach proof lifted from one sealed connection is refused on another (fresh per-connection nonce). A two-connection `drain` works with --key-env although the variable is consumed on first read. One host over loopback, not two machines; the guarded broker here is opened in-process (the CLI's `serve --secret-file` face is broker.cli.serve-guarded) and the replay case uses the library client."
command = "cargo test --locked -p astream-broker --features \"aead cap\" --test cli_fleet_sealed"

[[claim]]
id = "broker.cli.serve-guarded"
kind = "test"
text = "`asb serve --secret-file PATH | --secret-env NAME` opens a guarded broker (asb built with `cap`). Over real subprocesses and sockets: a capability `asb mint` sealed under the broker's secret publishes and fetches back; one minted under another secret, or none at all, exits 1 and lands nothing, while an unguarded broker accepts the capability-less publish. A secret file readable by group/other, a secret under 32 bytes (a `--secret-file` counted byte for byte, so a raw 32-byte secret ending in whitespace is used whole, exactly as a broker reading the file verifies it; `--secret-env` trimmed, and a file holding the same text plus a newline is a different secret whose capability is refused), or conflicting/unset secret sources are usage errors (exit 2) before any log is created; a build without `cap` refuses the flag by name. A non-loopback TCP bind needs `--allow-remote`, a world-readable `--key-file` is refused on serve, `--unix` beside a sealed TCP listener serves one broker and guard on both, and a refused bind removes only the log that invocation created. One host over loopback; `--allow-remote` is exercised only as the refusal it lifts."
command = "cargo test --locked -p astream-broker --features \"aead cap\" --test cli_serve_guarded"

[[claim]]
id = "broker.cli.defect-regressions"
kind = "test"
text = "On the real `asb` binary over a Unix socket: 48 `pub --seq-file` runs on one file, six concurrent at a time, all publish as `new` with an exact counter; `last` follows the broker's resume cursor past its 4096-row page bound (4097 subjects), with --max still bounding and --after resuming; a cap-file grant containing a space attaches verbatim while its truncation is refused; `drain --idle 0` exits 2 before connecting; a dead stdout exits 1, not a panic, and write verbs restate the durable fact with `Do NOT retry`; a dead stderr keeps the exit status; `commit`/`ack` operands at or past the visible head exit 2, leaving the group intact, also on a guarded broker; source comments are string-checked not to contradict the code. Not covered: filesystems without advisory locks, or the 65536-entry scan bound; the fixture is published through the library."
command = "cargo test --locked -p astream-broker --features cap --test cli_defects --test cli_status_and_range"

[[claim]]
id = "cap.unforgeable-mint"
kind = "test"
text = "A capability is a signed astream_wire Filter: the subject subtree its bearer may attach to. astream-cap mints it with HMAC-SHA256 (RFC 2104 over the vetted sha2, checked against the RFC 4231 vector) and verifies it with a tag compare that folds all 32 bytes with no data-dependent early exit -- asserted structurally on the private verify_diff that verify calls (for every ordered pair of tampered tag bytes the returned fold carries both differences), and moving the compare out of verify_diff fails the build via deny(dead_code). This is not a timing measurement; a wrong-length tag is refused on length alone. A genuine capability grants exactly its subtree; a widened filter with the old tag, a guessed tag, and the wrong secret are rejected. This covers who may attach where, not confidentiality (see aead.seal-open.authenticated)."
command = "cargo test --locked -p astream-cap"

[[claim]]
id = "cap.grant-mode-and-producer"
kind = "test"
text = "A capability is a signed grant string '[rw|ro][,p=<principal>]:<filter>' with the HMAC over the whole string, so mode and bound principal are as unforgeable as the subtree. A bare filter parses as read-write unbound; 'ro:' reads its subtree but is refused publish and commit; 'rw,p=<principal>:' publishes only under producer_id_of(principal) (pinned on vectors). A flipped mode, swapped or dropped principal, or widened filter under a genuine tag is rejected, and Grant::parse fails closed on malformed input. attach_proof/verify_attach round-trip and refuse another nonce, grant, tag, secret, or proof length, and the grant is parsed only after its proof matches; the proof compare is asserted to fold all 32 bytes, structurally, not by timing. Library only (no broker; see broker.cap-keyring-enforced); producer_id_of says nothing about who issued a principal, and per-class principal name shapes are not enforced."
command = "cargo test --locked -p astream-cap"

[[claim]]
id = "cap.expiry-enforced"
kind = "test"
text = "A capability may carry a signed `exp=<unix-ms>` field in its grant prefix (each field at most once); malformed, repeated or unknown fields are refused, and older grant shapes still parse and never expire. Expiry is half-open (valid at exp-1, expired at exp) and an unparseable grant counts as expired. All four grant predicates reach authority through one private function that checks it: they refuse at and after the deadline while the capability still verifies, and editing the deadline breaks verification and the attach proof. Against a broker reading a real wall clock, an expired capability is refused at attach as `expired`, a future one works normally, and a connection attached while live loses authority once the deadline passes: checked per request, and an open subscription (streaming or parked) ends with an `expired` error at the deadline of the grants that authorized it. This is expiry, not revocation before the deadline, and nothing bounds how far ahead a mint may date."
command = "cargo test --locked -p astream-cap && cargo test --locked -p astream-broker --features cap --test cap_expiry --test cap_hardening"

[[claim]]
id = "cap.capfile-one-line-format"
kind = "test"
text = "`astream_cap::capfile` is the one capability-file format: a line is `<grant> <tag-hex>` as `asb mint` prints it; lines are trimmed, blank and `#` lines skipped, split at the LAST ASCII whitespace (a grant may hold a space), and the tag is exactly 64 hex digits. format_line and parse_line round-trip grants holding spaces and `#` over tags covering every byte value; wrong tag lengths and non-hex bytes are refused at the exact byte without echoing the tag; a malformed file reports its first bad line as `path:line`. The same source is compiled by path into a default (non-`cap`) asb, and the second command runs its tests there. The grant half is not validated here (Grant::parse and verify decide authority), and asb's end-to-end behaviour through it is pinned by the broker.cli.* claims, not this command."
command = "cargo test --locked -p astream-cap --lib capfile && cargo test --locked -p astream-broker --bin asb capfile"

[[claim]]
id = "broker.cap-enforced-on-attach"
kind = "test"
text = "A guarded broker (Broker::open_guarded) requires every connection to attach a capability that grants each subject it publishes and contains each filter it subscribes (Subscribe, SubscribeGroup, ForkSubscribe alike); out-of-grant requests, un-attached connections (for every verb), and forged or widened capabilities (refused at the attach) are all refused, while the scoped subtree is delivered; a connection that has not attached within the first-frame timeout is refused and closed, however much it talks. Consumer groups are named as subjects the capability must grant: Commit, the commit half of read-process-write, and SubscribeGroup are each refused when either the group or the filter/output is out of scope, and work when both are in scope. A Last page's resume cursor is absent or a subject the requested filter matches, never an out-of-grant index entry. Enforcement is off by default: without the `cap` feature no secret can be set, and default-broker claims are unaffected."
command = "cargo test --locked -p astream-broker --features cap --test cap_enforcement --test broker_core_regressions --test guarded_preauth"

[[claim]]
id = "broker.cap-keyring-enforced"
kind = "test"
text = "Attach is a proof of possession: Hello returns a fresh 32-byte per-connection nonce and Attach carries HMAC(tag, nonce + grant); a missing Hello, a forged proof, and a proof replayed on another connection are refused. The ring holds up to 16 grants and authorizes existentially across them. A read-only grant cannot publish or commit; a bound read-write grant publishes only under producer_id_of(its principal), an unbound one under any id. Replicate needs an unbound link grant and cannot inject hidden /a/will or /a/bind records into a log the broker owns. Bound attaches record a hidden id -> principal table, rebuilt on open, that refuses collisions; it is only as strong as who may write /a/bind. The Will verb's binding is not asserted here. The nonce is not claimed cryptographically random, the tag still sits in the capability file, and a compromised broker can forge anything."
command = "cargo test --locked -p astream-broker --features cap --test cap_keyring"

[[claim]]
id = "broker.will-fires-exactly-once"
kind = "test"
text = "A Will registers a record the broker publishes for a connection when it ends: persisted first as a hidden /a/will record, fired as an ordinary deduped publish, and fenced (skipped if the producer has since published a higher sequence). A dropped connection's `gone` row lands right after its live row; a later incarnation fences an earlier one's will; acks never fence it. One will and producer id per connection; hidden subjects are refused; registration reserves against the producer's subject bound, durably; under `cap` a will is authorized as the publish it becomes. Opening a dead broker's log fires each persisted will exactly once; a replica log never fires one. Connection-end firing is fire-and-forget (the next open completes it); a half-open TCP peer is noticed late; only a producer's latest will re-fires on open; a will proves a connection ended, not session liveness; on the Replicated tier registration is acked on the local commit, so the will is only as durable as the leader's log."
command = "cargo test --locked -p astream-broker --features cap --test will --test broker_core_regressions --test will_bound --test will_fence --test replica_injection"

[[claim]]
id = "broker.inbox-drain-ack-exactly-once"
kind = "test"
text = "client::drain (group subscription plus a commit connection) and client::ack (one ProcessAndProduce record carrying the ack body and the group advance, keyed `ACK_SEQ_BASE | offset`) implement the inbox loop. Over Unix sockets: dropping a subscription before its commit re-delivers the same records (at-least-once); after the commit the next drain resumes past them; a fully committed group delivers nothing. An ack retry returns the same offset deduped, appends nothing, and moves the cursor exactly once. An ask at offset R is answered with re=R on the asker's lane; ForkSubscribe at R swaps the ask, keeps the recorded answer, and closes with a Mark. Crashes are modelled by dropping connections, not killing a process. Not asserted here: the ack-key contract, that retrying an ack written under the older bare-offset key appends a second answer, or the frame-atomic idle stop."
command = "cargo test --locked -p astream-broker --test inbox_drain --test broker_core_regressions"

[[claim]]
id = "broker.drain-idle-window-frame-atomic"
kind = "test"
text = "Subscription::set_read_timeout's idle stop is frame-atomic: with a timeout injected by a wrapper socket at an exact byte offset, a take cut 64 bytes into a 200 KiB record returns empty and the next take on the same subscription returns that record whole, leaving the stream at a frame boundary; the documented drain shape still delivers two records exactly once and commits. A sealed group subscription can set an idle window (an empty turn returns instead of parking) with its commit landing over the sealed wire, Subscription::get_ref reaches the underlying TcpStream, and a timeout 150 KB into the sealed stream, mid sealed-record and mid frame, resumes on both layers. set_read_timeout exists only for Unix, TCP and (with aead) sealed TCP streams; other stream types must bound the socket via get_ref. No timeout duration is measured."
command = "cargo test --locked -p astream-broker --features aead --test client_idle_frame_atomic --test client_sealed_idle --test client_sealed_resume"

[[claim]]
id = "broker.barrier-count-by-last"
kind = "test"
text = "An acknowledged broadcast is a count over the log, not a broker primitive: the barrier's name is the offset B in its PublishAck, a member's answer is an ordinary record on /f/F/pub/<node>/<sid>/ack/<B>, and the issuer counts one Last query over /f/F/pub/*/*/ack/<B>. With five members, one pre-publishing an ack below B and four answering (one `refused`), the rows at offsets >= B are exactly the four answerers, and counting without the offset test gives a different set; a re-sent ack dedups to its original offset; a query before any answer returns an empty page at once and the connection stays usable. A pattern, not a primitive: an absent member may be busy, crashed or nonexistent, presence rows can be stale, the broker is unguarded, and Client::last drops the resume cursor, so a fleet past the Last bounds must page with Client::last_page (not exercised)."
command = "cargo test --locked -p astream-broker --test barrier"

[[claim]]
id = "broker.proto.tag-budget"
kind = "test"
text = "A codec-level budget: this unit test pins twelve request tags (0x01-0x0C: Publish, Subscribe, ForkSubscribe, Commit, ProcessAndProduce, SubscribeGroup, Attach, Replicate, Last, Fetch, Will, Hello) and five response tags (0x81-0x85: PublishAck, Delivery, Error, Mark, Nonce) to their variants, each round-tripping through encode and decode, and sweeps every byte 0..=255 against a zero-filled body to assert the decodable set is exactly those seventeen. It pins PROTO_VERSION 2 and BREC_VERSION 2, and asserts that every tag under the wrong version byte decodes to nothing and that a Mark cut short before `resume` is malformed, not an empty resume. It proves codec rejection only: no broker is started and no Error frame asserted, so it says what the wire admits, not what a broker answers."
command = "cargo test --locked -p astream-broker --lib proto"

[[claim]]
id = "aead.seal-open.authenticated"
kind = "test"
text = "astream-aead seals messages under a 32-byte pre-shared key with XChaCha20-Poly1305 (RustCrypto's chacha20poly1305) and random 192-bit nonces. Seal/open round-trips; two seals of one plaintext differ; any flipped byte, a wrong key or AAD, or truncation fails to open, leaving the buffer untouched; the draft-irtf-cfrg-xchacha A.3.1 vector pins ciphertext and tag byte-for-byte. The SealedStream record layer, over loopback sockets, binds each record's AAD to both hellos, direction and sequence, so cross-connection, reflected, reordered, replayed or dropped records and a wrong key are refused, poisoning the stream. A 16 MiB frame splits into bounded records and reassembles byte-identically; out-of-range length prefixes are rejected before any body is read; a timed-out read resumes at the record boundary; try_clone shares both sequence counters."
command = "cargo test --locked -p astream-aead"

[[claim]]
id = "broker.sealed-tcp-roundtrip"
kind = "test"
text = "Broker::serve_tcp_sealed and Client::connect_tcp_sealed run the same exactly-once Frame protocol inside the XChaCha20-Poly1305 SealedStream under a pre-shared key. Over real sockets: sealed publish -> subscribe is ordered exactly-once, resume is gapless, and re-sends dedup; one connection that publishes then subscribes receives both acks and deliveries through its cloned handles; a record at the store's payload cap round-trips byte-identically (one byte more is refused); a wrong-key client fails at connect, and a keyless peer sending a forged confirm gets only the broker's hello and confirm before the connection closes. A silent peer is dropped at the pre-authentication deadline (asserted between 4 s and 12 s), and with 64 peers held in handshake the next connection is dropped at once. Off by default (the `aead` feature); AAD binding is aead.seal-open.authenticated."
command = "cargo test --locked -p astream-broker --features aead --test sealed_transport"

[[claim]]
id = "broker.any-connection-closer"
kind = "test"
text = "`connect(&Transport, endpoint, timeout) -> (AnyClient, Closer)` is one transport-erased connection over Unix, plain TCP, the sealed and the handshake wires; a wire the build lacks is refused as Unsupported naming the feature (asserted in a default build, not by this command). Over real sockets: publish/fetch round-trips with dedup on all four transports; the Closer (a duplicate of the socket under any record layer) unparks a blocked Subscription::recv promptly, and a second close is a no-op; Closer read/write timeouts turn a silent or non-reading peer into a timeout error; a connect timeout bounds the sealed and handshake handshakes and, on Linux, a TCP connect to a full accept queue; connect_tcp_timeout tries each resolved address; a zero timeout is InvalidInput; Debug of a keyed transport redacts the key. Name resolution and Unix connects are not bounded, and a timed-out request/reply leaves the connection out of step, so it must be dropped."
command = "cargo test --locked -p astream-broker --features handshake --test any_connection"

[[claim]]
id = "aead.handshake.forward-secret-key-agreement"
kind = "test"
text = "The handshake derives a fresh per-session key from an ephemeral X25519 exchange authenticated by the pre-shared key (NNpsk: key = HKDF-SHA256(salt=PSK, ikm=X25519(ephemerals), info=label || client_pub || server_pub)) and discards the ephemeral secrets, so a later PSK compromise cannot decrypt past traffic. HMAC-SHA256 and HKDF-SHA256 are composed in-crate over sha2 and pinned to the RFC 4231 and RFC 5869 A.1 vectors; only raw X25519 is delegated (x25519-dalek). The transcript is role-ordered so a reflected message derives a different key, and a low-order DH point is rejected. A matching PSK agrees and talks over a real socket pair; a mismatched PSK cannot establish a working session. Off by default (the `handshake` feature)."
command = "cargo test --locked -p astream-aead --features handshake"

[[claim]]
id = "broker.handshake-tcp-roundtrip"
kind = "test"
text = "Broker::serve_tcp_handshake and Client::connect_tcp_handshake run the PSK-authenticated ephemeral X25519 key agreement before the same exactly-once Frame protocol, each connection deriving a fresh session key for the SealedStream. Over real sockets: publish -> subscribe is ordered exactly-once, resume is gapless, and re-sends dedup, each over a distinct session; a wrong-PSK peer is refused while a correctly keyed client is unharmed; a plaintext peer is refused (bad handshake magic). The handshake runs off the acceptor thread under a per-connection deadline, so a normal client handshakes and publishes while a silent peer is parked. Off by default (the `handshake` feature)."
command = "cargo test --locked -p astream-broker --features handshake --test handshake_transport"

[[claim]]
id = "aead.identity.mutual-signed-dh"
kind = "test"
text = "Authentication by long-term Ed25519 identity keys with no shared secret, via a mutual signed Diffie-Hellman handshake: the client pins the broker's host key and the broker allow-lists client identities. Identity keys only sign the ephemeral transcript and the session key comes from the ephemeral X25519 DH alone, so forward secrecy survives an identity-key compromise. Each side signs its view of both ephemeral keys under a role-tagged context (defeating ephemeral substitution and reflection), checked with verify_strict before any trust decision. Over a real socket pair, mutual auth succeeds and the server learns the client id; a wrong pinned host key, a client not on the allow-list, and tampered or role-swapped signatures are refused. Only raw Ed25519 is delegated (ed25519-dalek). Off by default."
command = "cargo test --locked -p astream-aead --features identity"

[[claim]]
id = "broker.identity-tcp-roundtrip"
kind = "test"
text = "Broker::serve_tcp_identity presents a host identity and allow-lists client identities; Client::connect_tcp_identity pins the host key and presents its own. After the mutual signed-DH handshake the same exactly-once Frame protocol runs, forward-secret per connection. Over real sockets: publish -> subscribe is ordered exactly-once with gapless resume and dedup; a client pinning the wrong host key, a client not on the allow-list, and a plaintext peer are refused. The handshake runs off the acceptor thread under a per-connection deadline. Off by default (the `identity` feature)."
command = "cargo test --locked -p astream-broker --features identity --test identity_transport"

[[claim]]
id = "broker.log-encrypted-at-rest"
kind = "test"
text = "Broker::open_encrypted / BrokerLog::open_encrypted seal each record's payload on disk with XChaCha20-Poly1305 (astream-aead), with a fresh random nonce per record and the record's log index as AAD. Tested: bodies and subjects are absent from the raw file; reopening with the right key recovers everything in order with dedup intact; a wrong key is refused as a corrupt tail, never silently truncated; a CRC-valid reframed tamper is caught by the AEAD tag and a CRC-breaking flip by corrupt-tail detection; a plaintext open of an encrypted log is refused rather than wiped. Off by default (the `at-rest` feature). Sealing hides content, not structure: record count, sizes and timing stay visible; the AAD binds a record to its index, not its log, so logs sealed under one key can have same-index records swapped undetected (use a key per log); and a write-capable attacker can tail-truncate the log undetectably unless anti-rollback is enabled (broker.log-anti-rollback)."
command = "cargo test --locked -p astream-broker --features at-rest --test at_rest"

[[claim]]
id = "broker.log-anti-rollback"
kind = "test"
text = "Broker::open_encrypted_verified keeps an authenticated monotonic watermark sidecar (`<log>.hw`, sealed under the at-rest key with a domain-separated AAD, holding the head offset and a per-log identity taken from the first record's tag), rewritten via tmp+rename after every durable commit and fail-closed (a failed watermark write poisons the log until reopen), so no batch is acked without its head covered; the first commit binds the watermark to the log's identity before its first record lands, so a crash there leaves a log a verified open accepts; on open, a head below the watermark is refused as a rollback. Tested over real files: a truncated log, a same-key watermark from another log, a deleted watermark on a non-empty log, and a tampered watermark are each refused; a normal reopen recovers and advances it. Off by default (the `anti-rollback` feature). It defeats a key-less attacker only: a key holder can forge a watermark, and restoring an older snapshot of this log's own (log, .hw) pair would need a hardware monotonic counter, out of scope."
command = "cargo test --locked -p astream-broker --features anti-rollback --test anti_rollback && cargo test --locked -p astream-broker --features anti-rollback,retention --lib --test store_regressions -- watermark pre_bind"

[[claim]]
id = "broker.log-retention"
kind = "test"
text = "Broker::retain_before / BrokerLog::retain_before drops records below a floor offset while keeping surviving offsets absolute: after retain_before(3) on a 5-record log the two survivors keep offsets 3 and 4, the head is unchanged, a floor at or below the base drops nothing, and a reopen recovers the base and offsets. On an encrypted log kept records recover under their original offset AADs, and retention re-identifies the anti-rollback watermark and binds the base into it, so a tampered `<log>.base` sidecar is refused. The kept suffix is rewritten via tmp+rename with the log's permissions, and an in-process failure afterwards poisons the log. A floor that would drop a producer binding or a still-pending will is refused, naming the highest floor retention can take. Off by default (the `retention` feature). Dedup keys of pruned records are dropped, so exactly-once holds only within the retention window; a crash between the rewrite and the base/watermark update makes the next open refuse, recoverable only from backup."
command = "cargo test --locked -p astream-broker --features retention,anti-rollback --test retention && cargo test --locked -p astream-broker --features retention,anti-rollback --lib --test store_regressions -- retention"

[[claim]]
id = "kafka.handshake-and-metadata"
kind = "test"
text = "astream-kafka encodes and decodes Kafka's request/response framing, ApiVersions, and Metadata in v0 wire format. Tested non-circularly: request bytes laid out per the Kafka protocol yield response bytes asserted independently against the spec layout -- the size prefix, the echoed correlation id, ApiVersions capped at max_version=0, and Metadata returning this broker and the served topic with one partition led by this node; a malformed request returns None without panicking. A codec only: it opens no socket, is not wired into the broker, lacks the Produce/Fetch data path and flexible versions, and no Kafka client can connect to astream today."
command = "cargo test --locked -p astream-kafka"

[[claim]]
id = "evidence.selftest.hash-pinned"
kind = "selftest"
text = "A deterministic command's output hash is pinned, demonstrating output-drift detection."
command = "cargo run --quiet --locked -p astream-evidence -- selftest"
expected_output_sha = "58c620054bd6d7ec04319bf1abbc3f222a2a40fa146ae11b2328c06f3dbffba4"

[[claim]]
id = "wire.bench.frame-roundtrip-floor"
kind = "bench"
text = "Frame encode/decode holds a throughput floor (a regression gate, not a cross-system comparison; those land with the broker on disclosed hardware)."
command = "cargo run --quiet --release --locked -p astream-wire --example microbench"
metric = "frame_roundtrip_ops_per_sec"
min_value = 100000.0

[[claim]]
id = "wire.bench.match-floor"
kind = "bench"
text = "The wildcard matcher holds a throughput floor on a deep pattern, guarding against an accidental complexity regression."
command = "cargo run --quiet --release --locked -p astream-wire --example microbench"
metric = "match_ops_per_sec"
min_value = 1000000.0

[[claim]]
id = "wire.bench.crc32-floor"
kind = "bench"
text = "crc32_ieee, run on every frame encode and decode, must stay several times faster than the bitwise CRC it replaces, gated as a ratio: the example times both forms over the same 64 KiB buffer, asserts they agree, and prints crc32_speedup_vs_bitwise (the bitwise reference lives only in the example). A regression to the bitwise form drives the ratio to ~1.0 and fails. The two forms are timed in separate consecutive windows, not interleaved, so contention in one window can move the ratio either way; nothing asserts its stability under load. crc32_mib_per_sec is printed but not gated."
command = "cargo run --quiet --release --locked -p astream-wire --example microbench"
metric = "crc32_speedup_vs_bitwise"
min_value = 2.0

[[claim]]
id = "engine.bench.append-floor"
kind = "bench"
text = "The single-writer append hot path (Record -> versioned envelope -> CRC frame -> in-memory disk through the effect seam) holds a throughput floor. A regression gate on the engine's write path, not a cross-system comparison; cross-system numbers land with the broker on disclosed hardware."
command = "cargo run --quiet --release --locked -p astream-engine --example engine_microbench"
metric = "engine_append_ops_per_sec"
min_value = 300000.0

[[claim]]
id = "engine.bench.replay-floor"
kind = "bench"
text = "The read-by-offset replay hot path (Frame::decode + Envelope::from_payload over stored bytes) holds a throughput floor, guarding the path every replay/fork/resume depends on against a catastrophic slowdown."
command = "cargo run --quiet --release --locked -p astream-engine --example engine_microbench"
metric = "engine_replay_ops_per_sec"
min_value = 400000.0

[[claim]]
id = "term.bench.fold-floor"
kind = "bench"
text = "The pure VT screen fold holds a throughput floor over a representative 80x24 cursor/SGR/text stream. The rate is whole-machine and contention can only depress it, so the floor is set roughly 12x below the quiet-machine rate: it catches only a catastrophic, order-of-magnitude fold slowdown, not a 2x regression. No same-run ratio is gated, and nothing here measures load or asserts stability."
command = "cargo run --quiet --release --locked -p astream-term --example term_microbench"
metric = "term_fold_ops_per_sec"
min_value = 12000.0

[[claim]]
id = "broker.ack-key-is-one-wire-contract"
kind = "test"
text = "`client::ack` and `asb ack` derive an ack's producer sequence as `ACK_SEQ_BASE | offset` from one exported constant, so broker dedup recognises a retry that crosses faces: an ack sent through the library, then the CLI's derivation of the same ack sent as the `process_and_produce` frame `asb` sends, is deduped to the original offset and appends nothing. A second test arranges the collision the reservation prevents -- producer 9 publishes sequences 1..=6, then acks input offset 5 -- and asserts the ack is not deduped. The CLI frame is built in-process: the asb binary is not spawned, the will-fence separation is asserted by broker.will-fires-exactly-once, and a caller picking sequences by hand must still keep ordinary publishes below 2^63."
command = "cargo test --locked -p astream-broker --test cross_face_ack"

[[claim]]
id = "evidence.bench-retry-is-an-estimator"
kind = "test"
text = "The evidence runner re-runs a bench claim that missed its bound up to BENCH_ATTEMPTS = 3 times and keeps the best sample, since contention can only slow a throughput measurement. Pinned: a bench low once then passing passes and reports the best sample; one below its floor on every sample still fails, naming the floor; a ceiling is the same rule inverted; a claim with both bounds keeps the sample nearest the band, so an in-band sample after an overshoot passes and an all-miss run fails reporting the nearest; a bench printing no metric fails; a `test` claim runs exactly once even when a retry would pass. The fixtures are `sh` one-liners with a counter file, so this pins the runner's rule, not whether any floor is set well; best-of-N cannot rescue a floor a contended machine misses every time."
command = "cargo test --locked -p astream-evidence --test bench_retry"
